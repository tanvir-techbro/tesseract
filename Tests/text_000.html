<!-- tags structure: -->

<!-- A tag starts with a left angular bracket and right angular bracket. this called opening tag. A tag ends with Left angular bracket, one slash and a right angular bracket. html never throw any error if the tag is wrong. -->

<tagName> </tagName>


<!--
1. Header tags: this tags used for heading.
-->

<!-- six types of header tag -->
<h1>hello world</h1>
<h2>hello world</h2>
<h3>hello world</h3>
<h4>hello world</h4>
<h5>hello world</h5>
<h6>hello world</h6>


<!-- 2. div is tag that wrapped everything -->

<div>
  
</div>


<!-- example: div tag with heading tag -->

<div>
  <h1>A h1 tag in a div</h1>
</div>


<!-- 3. paragraph tag: this use for write paragraph text -->
<p> </p>

<!-- example: -->

<p>
  Lorem ipsum dolor sit amet, consectetur adipisicing elit. Enim, quos.
</p>
